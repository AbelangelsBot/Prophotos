version: "3.8"

services:
  db:
    image: postgres:16
    container_name: prophotos-db
    environment:
      POSTGRES_DB: prophotos
      POSTGRES_USER: prophotos
      POSTGRES_PASSWORD: prophotos
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prophotos -d prophotos"]
      interval: 10s
      timeout: 5s
      retries: 5

  prophotos:
    build:
      context: ./prophotos
      dockerfile: dockerfile
    image: abelangel/photos:latest
    container_name: prophotos-web
    working_dir: /app
    volumes:
      - ./prophotos:/app
      - /app/node_modules
    ports:
      - "8082:8082"
    # If/when the frontend needs the DB, enable depends_on
    # depends_on:
    #   - db

  users:
    build:
      context: ./backend-users
      dockerfile: Dockerfile
    image: abelangel/photos_users:latest
    container_name: prophotos-users
    working_dir: /app
    environment:
      DJANGO_SETTINGS_MODULE: users_service.settings
      DEBUG: ${DEBUG}
      SECRET_KEY: ${USERS_SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      TOKEN_EXPIRATION_HOURS: ${TOKEN_EXPIRATION_HOURS}
      EMAIL_BACKEND: ${EMAIL_BACKEND}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      EMAIL_VERIFICATION_BASE: ${EMAIL_VERIFICATION_BASE}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
    volumes:
      - ./backend-users:/app
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  files:
    build:
      context: ./backend-files
      dockerfile: Dockerfile
    image: abelangel/photos_files:latest
    container_name: prophotos-files
    working_dir: /app
    environment:
      DJANGO_SETTINGS_MODULE: files_service.settings
      DEBUG: ${DEBUG}
      SECRET_KEY: ${FILES_SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      TOKEN_EXPIRATION_HOURS: ${TOKEN_EXPIRATION_HOURS}
      FILES_ROOT_DIR: ${FILES_ROOT_DIR}
    volumes:
      - ./backend-files:/app
      - "${PHOTOS_HOST_DIR}:/data/photos"
    ports:
      - "8002:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
